services:
  spark:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: spark

    command: >
      bash -c "
      mkdir -p /tmp/jupyter-runtime &&
      export HOME=/tmp/jupyter-home &&
      export JUPYTER_RUNTIME_DIR=/tmp/jupyter-runtime &&
      /opt/spark/sbin/start-master.sh &&
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --ServerApp.token=''
      "

    ports:
      - "8080:8080"
      - "7077:7077"
      - "8888:8888"
      - "4040:4040"

    environment:
      - SPARK_HOME=/opt/spark
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-src.zip
      - HOME=/tmp/jupyter-home
      - JUPYTER_RUNTIME_DIR=/tmp/jupyter-runtime

    volumes:
      - ./data:/data
      - ./spark:/spark
      - ./output:/output
      - ./notebooks:/opt/spark/work-dir

  spark-worker:
    image: spark:python3
    container_name: spark-worker

    depends_on:
      - spark

    command: >
      bash -c "
      /opt/spark/sbin/start-worker.sh spark://spark:7077 &&
      tail -f /dev/null
      "

    environment:
      - SPARK_HOME=/opt/spark

    ports:
      - "8081:8081"

    volumes:
      - ./data:/data
      - ./spark:/spark
      - ./output:/output

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8

    container_name: namenode

    hostname: namenode

    environment:
      - CLUSTER_NAME=bigdata
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000

    ports:
      - "9870:9870"
      - "9000:9000"

    volumes:
      - namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8

    container_name: datanode

    hostname: datanode

    depends_on:
      - namenode

    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9870

    ports:
      - "9864:9864"

    volumes:
      - datanode:/hadoop/dfs/data

volumes:
  namenode:
  datanode:
